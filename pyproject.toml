[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designatio"
version = "0.1.0"
description = "Universal AI design MCP, renderer and mockup-to-code toolkit"
requires-python = ">=3.10"
dependencies = ["cryptography>=43.0"]

[project.optional-dependencies]
image = ["Pillow>=10.0"]
test = ["pytest>=8.0"]
browser = ["playwright>=1.50"]
vision = ["Pillow>=10.0", "opencv-python-headless>=4.10", "pytesseract>=0.3.13"]
security = ["cryptography>=43.0"]
host = ["cryptography>=43.0"]

[project.scripts]
designatio = "designatio.cli:main"
designatio-doctor = "designatio.orchestrator:doctor_cli"
designatio-run = "designatio.orchestrator:run_cli"
designatio-bootstrap = "designatio.orchestrator:bootstrap_cli"

[tool.setuptools.packages.find]
include = ["designatio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

