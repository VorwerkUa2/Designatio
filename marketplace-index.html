<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Designatio Marketplace</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1020; color: #eef2ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 20% 0, #26366b 0, transparent 45%), #0b1020; }
      main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
      .eyebrow { color: #93c5fd; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.06em; }
      header > p:last-child { max-width: 620px; color: #b7c1d8; font-size: 1.1rem; line-height: 1.7; }
      #catalog { margin-top: 52px; }
      .card { margin: 14px 0; padding: 24px; border: 1px solid #29334d; border-radius: 18px; background: #111a2dcc; }
      .card h2 { margin: 0; font-size: 1.25rem; }
      .meta { color: #aab6d0; line-height: 1.7; }
      a { display: inline-block; margin-top: 8px; color: #93c5fd; font-weight: 700; }
      .empty, .error { padding: 24px; border: 1px solid #29334d; border-radius: 18px; color: #b7c1d8; background: #111a2dcc; }
      .error { color: #fecaca; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">Designatio</div>
        <h1>Marketplace</h1>
        <p>Плагіни та розширення для дизайн-процесів. Каталог публікується як JSON і не запускає код автоматично.</p>
      </header>
      <section id="catalog" aria-live="polite">
        <p id="status">Завантажую каталог…</p>
        <div id="entries"></div>
      </section>
    </main>
    <script>
      const status = document.querySelector("#status");
      const entriesRoot = document.querySelector("#entries");

      function addText(parent, tag, text, className) {
        const element = document.createElement(tag);
        element.textContent = text;
        if (className) element.className = className;
        parent.append(element);
        return element;
      }

      fetch(new URL("./marketplace.json", document.baseURI))
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((catalog) => {
          if (!Array.isArray(catalog.entries)) throw new Error("Invalid marketplace catalog");
          status.remove();
          if (catalog.entries.length === 0) {
            addText(entriesRoot, "p", "Каталог поки порожній. Плагіни з'являться тут після публікації.", "empty");
            return;
          }

          for (const entry of catalog.entries) {
            const card = document.createElement("article");
            card.className = "card";
            addText(card, "h2", String(entry.name ?? "Без назви"));
            addText(
              card,
              "p",
              `${String(entry.target ?? "невідомий тип")} · ${String(entry.version ?? "без версії")} · ${(Array.isArray(entry.platforms) ? entry.platforms : []).join(", ")}`,
              "meta",
            );
            if (typeof entry.bundle === "string" && entry.bundle) {
              const bundle = new URL(entry.bundle, document.baseURI);
              if (bundle.protocol === "https:" || bundle.origin === location.origin) {
                const link = addText(card, "a", "Завантажити bundle");
                link.href = bundle.href;
              }
            }
            entriesRoot.append(card);
          }
        })
        .catch((error) => {
          status.remove();
          addText(entriesRoot, "p", `Не вдалося завантажити каталог: ${error.message}`, "error");
        });
    </script>
  </body>
</html>
