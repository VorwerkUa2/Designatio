name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -e ".[test,image,vision,browser,security]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Install Tesseract
        if: runner.os == 'Windows'
        run: winget install --id UB-Mannheim.TesseractOCR --exact --accept-package-agreements --accept-source-agreements
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Run tests
        run: python -m pytest
