name: Publish Designatio marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare marketplace
        run: |
          mkdir -p output/pages
          printf '[{"name":"region-qa","version":"1.0.0","target":"security","entry":"entry.json","bundle":"region-qa.dsgzip","platforms":["windows","linux","macos"]}]' > output/hosted-entries.json
          python -m pip install -e ".[test]"
          python -m designatio.cli hosted-marketplace output/hosted-entries.json --output output/pages/hosted-index.json
      - name: Add Pages JSON header
        run: cp output/pages/hosted-index.json output/pages/marketplace.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
