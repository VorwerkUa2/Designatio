[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designatio"
version = "0.1.0"
description = "Universal AI design MCP, renderer and mockup-to-code toolkit"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=10.0"]
test = ["pytest>=8.0"]
browser = ["playwright>=1.50"]

[project.scripts]
designatio = "designatio.cli:main"

[tool.setuptools.packages.find]
include = ["designatio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

